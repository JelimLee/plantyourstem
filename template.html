<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Plant your STEM</title>
<style>
  :root { --bg:#0f1f12; --card:#162a1a; --line:rgba(74,222,128,.25); --ink:#e2e8f0; --dim:#86efac; --mute:#4ade80aa; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif; background:linear-gradient(180deg,#0c1a0f,#1a2a1c); color:var(--ink); line-height:1.75; }
  main { max-width:820px; margin:0 auto; padding:24px 20px 140px; }
  h1 { font-size:26px; margin:0 0 4px; color:#bbf7d0; }
  h2 { font-size:20px; margin:40px 0 8px; color:#bbf7d0; border-left:4px solid #22c55e; padding-left:10px; }
  h3 { font-size:14px; letter-spacing:.08em; color:var(--dim); margin:22px 0 6px; text-transform:uppercase; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px 16px; margin:8px 0; }
  .garden { display:flex; gap:8px; flex-wrap:wrap; font-size:13px; color:var(--dim); margin:10px 0 20px; }
  .garden span { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:2px 8px; }
  table { border-collapse:collapse; width:100%; font-size:14px; }
  td, th { border-bottom:1px solid var(--line); padding:6px 8px; vertical-align:top; text-align:left; }
  th { color:var(--dim); font-weight:600; }
  .en { font-family:Georgia,serif; font-size:16.5px; }
  .en .w { cursor:pointer; border-bottom:1px dotted transparent; }
  .en .w:hover { color:#93c5fd; border-bottom-color:#93c5fd; }
  .ko { color:#c7d2fe; margin-top:8px; font-size:15px; display:none; }
  .show-ko .ko { display:block; }
  .note { color:#fde68a; font-size:13.5px; margin-top:6px; }
  .show-seg .seg { padding:1px 3px; border-radius:3px; }
  .show-seg .S { background:rgba(59,130,246,.3); border-bottom:2px solid #3b82f6; }
  .show-seg .V { background:rgba(239,68,68,.3); border-bottom:2px solid #ef4444; }
  .show-seg .O { background:rgba(34,197,94,.3); border-bottom:2px solid #22c55e; }
  .show-seg .M { background:rgba(234,179,8,.25); border-bottom:2px solid #eab308; }
  .legend { display:none; gap:10px; font-size:12px; margin:6px 0; }
  .show-seg .legend { display:flex; }
  .legend i { font-style:normal; padding:0 6px; border-radius:3px; }
  .toolbar { position:sticky; top:0; z-index:5; background:rgba(12,26,15,.92); backdrop-filter:blur(6px); padding:10px 0; display:flex; gap:8px; border-bottom:1px solid var(--line); margin-bottom:10px; }
  button { background:#14532d; color:#dcfce7; border:1px solid var(--line); border-radius:8px; padding:6px 12px; font-size:13px; cursor:pointer; }
  button.on { background:#22c55e; color:#052e16; }
  button:disabled { opacity:.4; cursor:default; }
  .skel { margin:6px 0 0 4px; font-size:14px; color:#c7d2fe; }
  #pop { position:absolute; z-index:20; max-width:340px; background:#1e293b; color:#f1f5f9; border:1px solid #475569; border-radius:12px; padding:12px 14px; font-size:14px; box-shadow:0 12px 30px rgba(0,0,0,.5); display:none; }
  #pop b { color:#93c5fd; font-size:15px; }
  #pop .k { color:#86efac; font-weight:700; }
  #pop .x { position:absolute; top:6px; right:10px; cursor:pointer; color:#94a3b8; }
  #seed { position:fixed; right:22px; bottom:22px; z-index:30; text-align:center; cursor:pointer; user-select:none; }
  #seed .face { font-size:52px; filter:drop-shadow(0 6px 10px rgba(0,0,0,.5)); transition:transform .3s; }
  #seed.awake .face { animation:bounce 1.2s infinite; }
  #seed .say { background:#f8fafc; color:#0f172a; border-radius:12px; padding:6px 10px; font-size:12px; margin-bottom:6px; max-width:180px; }
  @keyframes bounce { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-8px)} }
  #quiz { position:fixed; inset:0; z-index:40; background:rgba(0,0,0,.65); display:none; align-items:center; justify-content:center; padding:20px; }
  #quiz .box { background:#0f172a; border:1px solid var(--line); border-radius:18px; width:100%; max-width:620px; padding:22px 24px; max-height:90vh; overflow:auto; }
  #quiz textarea { width:100%; min-height:110px; background:#1e293b; color:#f1f5f9; border:1px solid #475569; border-radius:10px; padding:10px; font-size:14px; font-family:inherit; }
  #quiz label { display:block; padding:5px 0; font-size:14px; cursor:pointer; }
  .tag { font-size:11px; color:var(--dim); letter-spacing:.06em; }
  .model { background:#1e293b; border-radius:10px; padding:10px 12px; font-size:14px; margin-top:8px; color:#c7d2fe; }
  .row { display:flex; gap:8px; margin-top:12px; flex-wrap:wrap; }
</style>
</head>
<body>
<main>
  <h1 id="title"></h1>
  <div id="garden" class="garden" title="섹션마다 씨앗 하나. 질문에 답해 발아시키면 나무가 됩니다"></div>
  <div class="toolbar">
    <button id="tKo">🇰🇷 번역 보기</button>
    <button id="tSeg">🧩 문장 구조</button>
    <span style="flex:1"></span>
    <span class="tag" style="align-self:center">단어를 누르면 이 문맥에서의 뜻이 떠요</span>
  </div>
  <div class="legend"><i class="seg S">주어 S</i><i class="seg V">동사 V</i><i class="seg O">목적어/보어 O</i><i class="seg M">수식어 M</i></div>
  <div id="map" class="card"></div>
  <div id="sections"></div>
</main>
<div id="pop"><span class="x">✕</span><div id="popBody"></div></div>
<div id="seed"><div class="say">다 읽으면 나를 발아시켜 줘…</div><div class="face">🌰</div></div>
<div id="quiz"><div class="box" id="quizBox"></div></div>
<script src="data.js"></script>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const key = sec => `pys:${DATA.file}:${sec.title}`;
const growth = ans => ans.length ? stage(ans.reduce((t,a)=>t+a.score,0)/ans.length) : '🌰';
const stage = avg => avg == null ? '🌰' : avg < 60 ? '🌱' : avg < 80 ? '🌿' : avg < 95 ? '🪴' : '🌳';

// ---------- glossary ----------
const gloss = new Map();
const norm = w => w.toLowerCase().replace(/[^a-z0-9'\-]/g, '');
for (const sec of DATA.sections) for (const g of sec.glossary || []) gloss.set(norm(g.en).replace(/\s+/g,' '), g);
for (const sec of DATA.sections) for (const g of sec.glossary || []) { const k = g.en.toLowerCase().trim(); if (!gloss.has(k)) gloss.set(k, g); }
function lookup(words, i) {
  // phrases of length 3..1 that include word i
  for (let len = 3; len >= 1; len--) for (let s = i - len + 1; s <= i; s++) {
    if (s < 0 || s + len > words.length) continue;
    const ph = words.slice(s, s + len).map(norm).join(' ');
    if (gloss.has(ph)) return gloss.get(ph);
  }
  const w = norm(words[i]);
  for (const c of [w, w.replace(/s$/,''), w.replace(/es$/,''), w.replace(/ied$/,'y'), w.replace(/ed$/,''), w.replace(/d$/,''), w.replace(/ing$/,''), w.replace(/ing$/,'e'), w.replace(/ly$/,''), w.replace(/ally$/,'al')])
    if (gloss.has(c)) return gloss.get(c);
  return null;
}
const wordify = t => esc(t).split(/(\s+)/).map(p => /^\s+$/.test(p) || !p ? p : `<span class="w">${p}</span>`).join('');

// ---------- render ----------
$('#title').textContent = DATA.title;
document.title = DATA.title + ' · Plant your STEM';
$('#map').innerHTML = `<h3 style="margin-top:0">📍 문서 지도</h3><table>${(DATA.map||[]).map(m =>
  `<tr><td><b>${esc(m.title)}</b><br><span class="tag">p.${esc(m.pages)} · ${'★'.repeat(m.level||1)}</span></td><td>${esc(m.summary)}</td></tr>`).join('')}</table>`;

function renderParagraph(p, sec) {
  let en = p.en, html = null;
  for (const b of sec.breakdown || []) {
    const sent = b.segments.map(s => s.t).join('');
    const at = en.indexOf(sent);
    if (at < 0) continue;
    html = wordify(en.slice(0, at)) + b.segments.map(s => s.type ? `<span class="seg ${s.type}">${wordify(s.t)}</span>` : wordify(s.t)).join('') + wordify(en.slice(at + sent.length));
    en = null; break;
  }
  return `<div class="card"><div class="en">${html ?? wordify(en)}</div><div class="ko">${esc(p.ko)}</div>${p.note ? `<div class="note">💬 ${esc(p.note)}</div>` : ''}</div>`;
}

$('#sections').innerHTML = DATA.sections.map((sec, i) => `
  <section data-i="${i}">
    <h2>${esc(sec.title)} <span class="tag">p.${esc(sec.pages)} · ${'★'.repeat(sec.level||1)}</span></h2>
    <div class="card">${esc(sec.summary)}</div>
    ${(sec.prereq||[]).length ? `<h3>🧱 먼저 알아야 할 것</h3><div class="card">${sec.prereq.map(p => `<div><b>${esc(p.term)}</b> — ${esc(p.note)}</div>`).join('')}</div>` : ''}
    <h3>📖 본문</h3>
    ${(sec.paragraphs||[]).map(p => renderParagraph(p, sec)).join('')}
    ${(sec.breakdown||[]).length ? `<h3>🧩 뼈대</h3><div class="card">${sec.breakdown.map(b => `<div class="skel">• ${esc(b.skeleton)}<br><span class="tag">${esc(b.note)}</span></div>`).join('')}</div>` : ''}
    <h3>💡 직관</h3><div class="card">${esc(sec.intuition)}${sec.misconception ? `<div class="note">⚠ 흔한 오해: ${esc(sec.misconception)}</div>` : ''}</div>
  </section>`).join('');

function renderGarden() {
  $('#garden').innerHTML = DATA.sections.map(sec => {
    const r = JSON.parse(localStorage.getItem(key(sec)) || 'null');
    return `<span>${stage(r?.score)} ${esc(sec.title)}${r ? ` ${r.score}점` : ''}</span>`;
  }).join('');
}
renderGarden();

// ---------- toggles ----------
$('#tKo').onclick = e => { document.body.classList.toggle('show-ko'); e.target.classList.toggle('on'); };
$('#tSeg').onclick = e => { document.body.classList.toggle('show-seg'); e.target.classList.toggle('on'); };

// ---------- word popover ----------
const pop = $('#pop');
document.addEventListener('click', e => {
  const w = e.target.closest('.w');
  if (!w) { if (!e.target.closest('#pop')) pop.style.display = 'none'; return; }
  const all = [...w.closest('.en').querySelectorAll('.w')], i = all.indexOf(w), words = all.map(x => x.textContent);
  const g = lookup(words, i), word = words[i].replace(/^[^A-Za-z0-9]+|[^A-Za-z0-9]+$/g, '');
  $('#popBody').innerHTML = g
    ? `<b>${esc(g.en)}</b> <span class="k">${esc(g.ko)}</span><div style="margin-top:6px">${esc(g.meaning)}</div>`
    : `<b>${esc(word)}</b><div style="margin-top:6px;color:#94a3b8">사전에 없는 단어예요. 터미널에서 "이 문맥에서 ${esc(word)} 뜻?" 이라고 물어보세요.</div>`;
  const r = w.getBoundingClientRect();
  pop.style.display = 'block';
  pop.style.left = Math.min(r.left + scrollX, innerWidth - 360) + 'px';
  pop.style.top = (r.bottom + scrollY + 8) + 'px';
});
pop.querySelector('.x').onclick = () => pop.style.display = 'none';

// ---------- seed + germination ----------
const seed = $('#seed');
let awake = false;
addEventListener('scroll', () => {
  if (!awake && innerHeight + scrollY >= document.body.scrollHeight - 80) {
    awake = true; seed.classList.add('awake');
    seed.querySelector('.say').textContent = '다 읽었네! 나를 눌러서 개념을 발아시켜 보자 🌱';
  }
});
seed.onclick = () => startQuiz();

function startQuiz() {
  const secs = DATA.sections.filter(s => (s.questions||[]).length);
  if (!secs.length) return;
  const sec = secs.find(s => !localStorage.getItem(key(s))) || secs[secs.length - 1];
  let qi = 0; const answers = [];
  const box = $('#quizBox'); $('#quiz').style.display = 'flex';
  const show = () => {
    const q = sec.questions[qi];
    box.innerHTML = `<div class="tag">${growth(answers)} 발아 ${qi+1}/${sec.questions.length} · ${esc(sec.title)} · ${esc(q.type)}</div>
      <p style="font-size:16px">${esc(q.q)}</p>
      <textarea id="ans" placeholder="원문을 보지 말고 내 말로 설명해 보세요…"></textarea>
      <div class="row"><button id="reveal">핵심 포인트 확인</button><button id="close">닫기</button></div>
      <div id="after"></div>`;
    $('#close').onclick = () => $('#quiz').style.display = 'none';
    $('#reveal').onclick = () => {
      $('#reveal').disabled = true;
      $('#after').innerHTML = `<h3>✔ 내 답에 들어 있었나요?</h3>${q.points.map((p, j) => `<label><input type="checkbox" data-j="${j}"> ${esc(p)}</label>`).join('')}
        <div class="model"><b>모범 답</b><br>${esc(q.model)}</div>
        <div class="row"><button id="next">${qi + 1 < sec.questions.length ? '다음 문제' : '결과 보기'}</button></div>`;
      $('#next').onclick = () => {
        const ticks = [...box.querySelectorAll('input:checked')].length;
        answers.push({ q: q.q, a: $('#ans').value, score: Math.round(100 * ticks / q.points.length) });
        if (++qi < sec.questions.length) show(); else finish();
      };
    };
  };
  const finish = () => {
    const score = Math.round(answers.reduce((s, a) => s + a.score, 0) / answers.length);
    localStorage.setItem(key(sec), JSON.stringify({ score, date: new Date().toISOString().slice(0,10) }));
    renderGarden();
    seed.querySelector('.face').textContent = stage(score);
    seed.querySelector('.say').textContent = score >= 95 ? '나무가 됐어! 다음 섹션 씨앗을 심자' : '더 발아시키려면 다시 눌러 줘';
    const clip = `[plant-your-stem check] ${DATA.file} / ${sec.title}\n` + answers.map((a, i) => `Q${i+1}: ${a.q}\nA${i+1}: ${a.a}`).join('\n\n');
    box.innerHTML = `<div style="text-align:center;font-size:64px">${stage(score)}</div>
      <h2 style="text-align:center;margin:0">${score}점 · ${esc(sec.title)}</h2>
      <p style="text-align:center;color:#94a3b8">${score < 60 ? '아직 씨앗이에요. 💡 직관 부분을 한 번 더 읽고 다시 발아시켜 봐요.' : score < 80 ? '새싹이 났어요. 빠진 포인트만 다시 보면 더 자라요.' : score < 95 ? '화분에 옮겨 심었어요. 거의 나무예요!' : '정원에 나무를 심었어요! 🎉'}</p>
      <div class="row" style="justify-content:center"><button id="copy">📋 답안 복사 → 터미널에서 Claude 채점</button><button id="close">닫기</button></div>
      <p class="tag" style="text-align:center">복사한 뒤 터미널에 <code>/plant-your-stem:check</code> 라고 치고 붙여 넣으면 Claude가 자세히 채점해요.</p>`;
    $('#copy').onclick = e => navigator.clipboard.writeText(clip).then(() => e.target.textContent = '복사됨 ✓');
    $('#close').onclick = () => $('#quiz').style.display = 'none';
  };
  show();
}
</script>
</body>
</html>
